<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa 400 m² — VR</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#e9e0d2}
#msg{position:fixed;z-index:20;top:12px;left:12px;right:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.92);font:16px Arial;color:#4b2f1e}
</style>
</head>
<body>
<div id="msg">Casa 400 m² — prova la scena qui. Sul Quest comparirà il pulsante “Enter VR”.</div>

<a-scene background="color:#e9e0d2"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  webxr="optionalFeatures: local-floor, bounded-floor">

  <a-entity light="type:ambient;intensity:1.8;color:#fff"></a-entity>
  <a-entity light="type:directional;intensity:2.5;color:#fff" position="-5 8 5"></a-entity>

  <!-- Pavimento piano terra: 20 x 20 m -->
  <a-plane rotation="-90 0 0" width="20" height="20"
           material="color:#5b4332;roughness:0.75"></a-plane>

  <!-- Pareti perimetrali, con altezza reale -->
  <a-box position="0 1.4 -10" width="20" height="2.8" depth=".18"
         material="color:#e2d7c2"></a-box>
  <a-box position="0 1.4 10" width="20" height="2.8" depth=".18"
         material="color:#e2d7c2"></a-box>
  <a-box position="-10 1.4 0" width=".18" height="2.8" depth="20"
         material="color:#e2d7c2"></a-box>
  <a-box position="10 1.4 0" width=".18" height="2.8" depth="20"
         material="color:#e2d7c2"></a-box>

  <!-- Grande separazione zona giorno / cucina -->
  <a-box position="0 1.4 3.8" width="20" height="2.8" depth=".18"
         material="color:#e2d7c2"></a-box>

  <!-- Isola cucina -->
  <a-box position="1.5 .55 7" width="4.8" height="1.1" depth="1.2"
         material="color:#eee8dc"></a-box>
  <a-box position="-4 .5 8.8" width="7" height="1" depth=".65"
         material="color:#eee8dc"></a-box>

  <!-- Salone -->
  <a-box position="-5 .55 -1.3" width="5.5" height="1" depth="1"
         material="color:#eee8dc"></a-box>
  <a-box position="-.5 .55 -2.3" width="1" height="1" depth="3.8"
         material="color:#eee8dc"></a-box>
  <a-box position="-2.2 .25 -2.0" width="2.2" height=".35" depth="1"
         material="color:#4b2f1e"></a-box>

  <!-- Cannettato -->
  <a-box position="-3 1.35 -9.85" width="5" height="2.5" depth=".08"
         material="color:#6f492d"></a-box>
  <a-box position="0 1.4 -9.84" width="6" height="2.3" depth=".08"
         material="color:#6f492d"></a-box>

  <!-- Primo piano: solo una piccola porzione visibile per testare la verticalità -->
  <a-box position="0 3.05 0" width="20" height=".1" depth="20"
         material="color:#c4b59e"></a-box>

  <!-- Camera: altezza occhi e posizione DENTRO la casa -->
  <a-entity id="cameraRig" position="-6 0 -1">
    <a-camera position="0 1.6 0" wasd-controls-enabled="false"></a-camera>
  </a-entity>

  <a-text value="CASA 400 m²" position="-3 2.4 -9.7"
          color="#4b2f1e" width="6"></a-text>
</a-scene>
</body>
</html>
