<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casa 400 m² — VR 2 piani arredata</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9e2d6;font-family:Arial,sans-serif}
#ui{position:fixed;z-index:20;top:14px;left:14px;right:14px;padding:14px 18px;border-radius:16px;background:rgba(35,28,23,.86);color:white;box-shadow:0 8px 28px #0004}
#ui b{font-size:20px} #ui span{display:block;margin-top:5px;font-size:14px;opacity:.9}
#enter{position:fixed;z-index:30;left:50%;bottom:24px;transform:translateX(-50%);padding:17px 30px;border:0;border-radius:30px;background:#201914;color:#fff;font-weight:700;font-size:18px}
#floor{position:fixed;z-index:25;right:14px;top:90px;padding:10px 14px;border:0;border-radius:14px;background:#fff;color:#241d18;font-weight:700}
</style>
<script>
AFRAME.registerComponent('thumb-move',{
  schema:{speed:{default:2.2}},
  init:function(){
    this.v=0; this.h=0;
    this.el.addEventListener('thumbstickmoved',e=>{this.v=e.detail.y;this.h=e.detail.x});
  },
  tick:function(t,dt){
    if(!dt||(!this.v&&!this.h))return;
    const rig=this.el.sceneEl.querySelector('#rig');
    if(!rig)return;
    const cam=rig.querySelector('[camera]');
    const p=rig.object3D.position, rot=cam.object3D.rotation;
    const s=this.data.speed*dt/1000;
    const forward=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,rot.y,0));
    const right=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,rot.y,0));
    p.x += (forward.x*(-this.v)+right.x*this.h)*s;
    p.z += (forward.z*(-this.v)+right.z*this.h)*s;
  }
});
AFRAME.registerComponent('floor-toggle',{
 init:function(){this.el.addEventListener('click',()=>document.querySelector('#rig').object3D.position.y=
  document.querySelector('#rig').object3D.position.y<2?3.25:1.65);}
});
</script>
</head>
<body>
<div id="ui"><b>CASA 400 m² · 2 PIANI</b><span>Zona giorno al piano terra · 4 camere al piano primo · 4 bagni · lavanderia · terrazzi</span><span>Quest 3: premi ENTRA IN VR. Usa lo stick per muoverti.</span></div>
<button id="floor" onclick="document.querySelector('#rig').object3D.position.y=document.querySelector('#rig').object3D.position.y<2?3.25:1.65">CAMBIA PIANO</button>
<button id="enter" onclick="document.querySelector('a-scene').enterVR()">ENTRA IN VR</button>

<a-scene renderer="colorManagement:true; physicallyCorrectLights:true" background="color:#d9d0c1"
 vr-mode-ui="enabled:true" webxr="optionalFeatures:local-floor,bounded-floor">
 <a-assets>
  <a-mixin id="wall" material="color:#d7c9b6;roughness:.85"></a-mixin>
  <a-mixin id="wood" material="color:#5a3826;roughness:.7"></a-mixin>
  <a-mixin id="lightwood" material="color:#9a7657;roughness:.72"></a-mixin>
  <a-mixin id="cream" material="color:#e8dfd2;roughness:.9"></a-mixin>
  <a-mixin id="dark" material="color:#2c211b;roughness:.6"></a-mixin>
  <a-mixin id="metal" material="color:#81766b;metalness:.8;roughness:.25"></a-mixin>
  <a-mixin id="glass" material="color:#a9c4c7;opacity:.38;transparent:true;roughness:.15"></a-mixin>
 </a-assets>

 <a-entity light="type:ambient;color:#fff3df;intensity:1.5"></a-entity>
 <a-entity light="type:directional;color:#fff4dc;intensity:2.2" position="4 10 5"></a-entity>

 <!-- WORLD / BUILDING: 20m x 20m footprint, 2 full floors -->
 <a-entity id="house">
  <!-- ground floor slab -->
  <a-box position="0 0 0" width="20" height=".18" depth="18" material="color:#8b7057"></a-box>
  <a-plane position="0 .11 0" rotation="-90 0 0" width="19.6" height="17.6" material="color:#b79b7e;roughness:.95"></a-plane>
  <!-- first floor slab -->
  <a-box position="0 3.15 0" width="20" height=".18" depth="18" material="color:#8b7057"></a-box>
  <!-- roof -->
  <a-box position="0 6.35 0" width="20.2" height=".25" depth="18.2" material="color:#493326"></a-box>

  <!-- EXTERIOR walls -->
  <a-box position="-10 1.6 0" width=".22" height="3.1" depth="18" mixin="wall"></a-box>
  <a-box position="10 1.6 0" width=".22" height="3.1" depth="18" mixin="wall"></a-box>
  <a-box position="0 1.6 -9" width="20" height="3.1" depth=".22" mixin="wall"></a-box>
  <a-box position="-7 1.6 9" width="6" height="3.1" depth=".22" mixin="wall"></a-box>
  <a-box position="7 1.6 9" width="6" height="3.1" depth=".22" mixin="wall"></a-box>
  <!-- upper exterior -->
  <a-box position="-10 4.75 0" width=".22" height="3.1" depth="18" mixin="wall"></a-box>
  <a-box position="10 4.75 0" width=".22" height="3.1" depth="18" mixin="wall"></a-box>
  <a-box position="0 4.75 -9" width="20" height="3.1" depth=".22" mixin="wall"></a-box>
  <a-box position="-7 4.75 9" width="6" height="3.1" depth=".22" mixin="wall"></a-box>
  <a-box position="7 4.75 9" width="6" height="3.1" depth=".22" mixin="wall"></a-box>

  <!-- ground internal walls: foyer / service / bathrooms -->
  <a-box position="0 1.55 -1.7" width=".18" height="3" depth="5.2" mixin="wall"></a-box>
  <a-box position="-5.5 1.55 3.0" width="9" height="3" depth=".18" mixin="wall"></a-box>
  <a-box position="5.5 1.55 3.0" width="9" height="3" depth=".18" mixin="wall"></a-box>
  <a-box position="7.0 1.55 5.8" width=".18" height="3" depth="5.6" mixin="wall"></a-box>
  <a-box position="3.6 1.55 6.8" width="4.7" height="3" depth=".18" mixin="wall"></a-box>
  <!-- upper corridor and bedrooms -->
  <a-box position="0 4.7 -1.0" width=".18" height="3" depth="16" mixin="wall"></a-box>
  <a-box position="-5 4.7 3.8" width="9.8" height="3" depth=".18" mixin="wall"></a-box>
  <a-box position="5 4.7 3.8" width="9.8" height="3" depth=".18" mixin="wall"></a-box>
  <a-box position="-5 4.7 -5.0" width="9.8" height="3" depth=".18" mixin="wall"></a-box>
  <a-box position="5 4.7 -5.0" width="9.8" height="3" depth=".18" mixin="wall"></a-box>
  <!-- upper ensuite -->
  <a-box position="7.1 4.7 -6.8" width=".18" height="3" depth="4.2" mixin="wall"></a-box>

  <!-- large windows -->
  <a-box position="-6.8 1.65 8.88" width="4.8" height="2.15" depth=".08" mixin="glass"></a-box>
  <a-box position="6.8 1.65 8.88" width="4.8" height="2.15" depth=".08" mixin="glass"></a-box>
  <a-box position="-6.8 4.8 8.88" width="4.8" height="2.15" depth=".08" mixin="glass"></a-box>
  <a-box position="6.8 4.8 8.88" width="4.8" height="2.15" depth=".08" mixin="glass"></a-box>

  <!-- stairs, physically connected -->
  <a-entity id="stairs">
   <a-box position="0 .3 6.5" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 .55 5.8" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 .8 5.1" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 1.05 4.4" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 1.3 3.7" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 1.55 3.0" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 1.8 2.3" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 2.05 1.6" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 2.3 .9" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 2.55 .2" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
   <a-box position="0 2.9 -.5" width="3.0" height=".35" depth="1.1" mixin="wood"></a-box>
  </a-entity>

  <!-- LIVING ROOM -->
  <a-box position="-5.8 .16 -5.0" width="6.8" height=".03" depth="5.8" material="color:#a88f75"></a-box>
  <a-box position="-6.5 .75 -5.5" width="3.8" height="1.1" depth="1.0" mixin="cream"></a-box>
  <a-box position="-6.5 1.2 -5.95" width="3.8" height=".08" depth=".08" mixin="dark"></a-box>
  <a-box position="-7.8 1.0 -5.5" width=".7" height=".65" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-4.2 1.0 -5.5" width=".7" height=".65" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-5.8 .48 -3.9" width="2.3" height=".32" depth="1.0" mixin="dark"></a-box>
  <a-box position="-5.8 .65 -3.9" width="1.7" height=".12" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-5.8 2.05 -8.87" width="2.8" height="1.55" depth=".10" mixin="dark"></a-box>
  <!-- fireplace -->
  <a-box position="-9.75 .75 -4.0" width=".15" height="1.35" depth="3.2" mixin="dark"></a-box>
  <a-box position="-9.65 .42 -4.0" width=".18" height=".15" depth="2.2" material="color:#b57a42"></a-box>

  <!-- DINING -->
  <a-cylinder position="-3.3 .85 -1.7" radius="1.05" height=".14" mixin="lightwood"></a-cylinder>
  <a-cylinder position="-3.3 .42 -1.7" radius=".12" height=".75" mixin="dark"></a-cylinder>
  <a-box position="-4.4 .55 -1.7" width=".65" height=".85" depth=".65" mixin="cream"></a-box>
  <a-box position="-2.2 .55 -1.7" width=".65" height=".85" depth=".65" mixin="cream"></a-box>

  <!-- KITCHEN ISLAND + CABINETS -->
  <a-box position="5.2 .95 -4.0" width="5.2" height="1.1" depth="1.35" mixin="dark"></a-box>
  <a-box position="5.2 1.52 -4.0" width="5.45" height=".10" depth="1.55" material="color:#d8c4aa"></a-box>
  <a-box position="7.5 1.0 -7.9" width="4.2" height="2.0" depth=".7" mixin="dark"></a-box>
  <a-box position="3.2 1.0 -7.9" width="2.0" height="2.0" depth=".7" mixin="dark"></a-box>
  <a-cylinder position="4.0 1.62 -4.0" radius=".16" height=".55" mixin="metal"></a-cylinder>
  <a-cylinder position="5.2 1.62 -4.0" radius=".16" height=".55" mixin="metal"></a-cylinder>
  <a-cylinder position="6.4 1.62 -4.0" radius=".16" height=".55" mixin="metal"></a-cylinder>

  <!-- LAUNDRY -->
  <a-box position="8.6 .55 5.2" width=".9" height=".95" depth=".75" mixin="cream"></a-box>
  <a-cylinder position="8.6 1.12 5.2" radius=".32" height=".05" mixin="dark"></a-cylinder>
  <a-box position="7.5 1.0 5.2" width=".8" height="1.8" depth=".7" mixin="cream"></a-box>

  <!-- GUEST BATH -->
  <a-box position="8.6 .55 7.6" width=".9" height=".75" depth="1.4" material="color:#f3eee7"></a-box>
  <a-cylinder position="8.6 1.2 7.6" radius=".42" height=".12" material="color:#f8f6f2"></a-cylinder>
  <a-box position="8.0 .45 7.0" width=".75" height=".75" depth=".75" material="color:#fff"></a-box>

  <!-- UPPER BEDROOM 1 -->
  <a-box position="-5.5 3.31 -6.9" width="8.2" height=".03" depth="3.0" material="color:#a88f75"></a-box>
  <a-box position="-6.2 4.05 -6.7" width="2.5" height=".5" depth="4.2" mixin="cream"></a-box>
  <a-box position="-6.2 4.35 -6.7" width="2.1" height=".35" depth="3.7" material="color:#b49a7d"></a-box>
  <a-box position="-7.7 3.75 -6.7" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-4.7 3.75 -6.7" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-8.7 4.8 -5.8" width="2.0" height="2.2" depth=".6" mixin="dark"></a-box>
  <!-- wardrobe -->
  <a-box position="-8.0 4.4 -8.3" width="3.0" height="2.1" depth=".65" mixin="wood"></a-box>

  <!-- UPPER BEDROOM 2 -->
  <a-box position="3.0 3.31 -6.9" width="6.0" height=".03" depth="3.0" material="color:#a88f75"></a-box>
  <a-box position="3.2 4.05 -6.7" width="2.3" height=".5" depth="4.0" mixin="cream"></a-box>
  <a-box position="3.2 4.35 -6.7" width="1.9" height=".32" depth="3.5" material="color:#b49a7d"></a-box>
  <a-box position="1.7 3.75 -6.7" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>
  <a-box position="4.7 3.75 -6.7" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>
  <a-box position="6.8 4.4 -8.2" width="3.0" height="2.1" depth=".65" mixin="wood"></a-box>

  <!-- UPPER BEDROOM 3 -->
  <a-box position="-5.5 3.31 2.0" width="8.2" height=".03" depth="3.0" material="color:#a88f75"></a-box>
  <a-box position="-6.2 4.05 2.0" width="2.5" height=".5" depth="4.2" mixin="cream"></a-box>
  <a-box position="-6.2 4.35 2.0" width="2.1" height=".35" depth="3.7" material="color:#b49a7d"></a-box>
  <a-box position="-7.7 3.75 2.0" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>
  <a-box position="-4.7 3.75 2.0" width=".7" height=".6" depth=".7" mixin="lightwood"></a-box>

  <!-- MASTER -->
  <a-box position="5.7 3.31 1.7" width="7.5" height=".03" depth="3.3" material="color:#a88f75"></a-box>
  <a-box position="5.8 4.05 1.8" width="2.8" height=".5" depth="4.5" mixin="cream"></a-box>
  <a-box position="5.8 4.38 1.8" width="2.4" height=".35" depth="4.0" material="color:#a9937c"></a-box>
  <a-box position="4.1 3.78 1.8" width=".75" height=".65" depth=".75" mixin="lightwood"></a-box>
  <a-box position="7.5 3.78 1.8" width=".75" height=".65" depth=".75" mixin="lightwood"></a-box>
  <!-- master walk-in -->
  <a-box position="8.6 4.4 -1.9" width="2.1" height="2.2" depth=".65" mixin="wood"></a-box>
  <!-- ensuite -->
  <a-box position="8.6 4.4 -6.8" width="2.2" height="2.2" depth=".65" material="color:#f1ece5"></a-box>
  <a-cylinder position="8.6 4.0 -5.9" radius=".38" height=".12" material="color:#fff"></a-cylinder>

  <!-- SECOND FLOOR BATHS -->
  <a-box position="-8.0 4.0 5.9" width="1.0" height=".8" depth="1.2" material="color:#fff"></a-box>
  <a-cylinder position="-6.8 4.9 6.6" radius=".35" height=".1" material="color:#fff"></a-cylinder>
  <a-box position="6.8 4.0 5.9" width="1.0" height=".8" depth="1.2" material="color:#fff"></a-box>
  <a-cylinder position="8.0 4.9 6.6" radius=".35" height=".1" material="color:#fff"></a-cylinder>

  <!-- lamps -->
  <a-entity light="type:point;color:#ffd9a8;intensity:1.0;distance:8" position="-5 2.6 -5"></a-entity>
  <a-entity light="type:point;color:#ffd9a8;intensity:.9;distance:7" position="5 2.6 -4"></a-entity>
  <a-entity light="type:point;color:#ffe4bf;intensity:.8;distance:7" position="-5 5.8 -6"></a-entity>
  <a-entity light="type:point;color:#ffe4bf;intensity:.8;distance:7" position="5 5.8 2"></a-entity>

  <!-- curtains -->
  <a-box position="-8.7 1.6 8.65" width=".25" height="2.8" depth=".35" material="color:#d7c6b5"></a-box>
  <a-box position="-4.9 1.6 8.65" width=".25" height="2.8" depth=".35" material="color:#d7c6b5"></a-box>
  <a-box position="-8.7 4.75 8.65" width=".25" height="2.8" depth=".35" material="color:#d7c6b5"></a-box>
  <a-box position="-4.9 4.75 8.65" width=".25" height="2.8" depth=".35" material="color:#d7c6b5"></a-box>

  <!-- terraces -->
  <a-box position="-7 0.05 10.0" width="6" height=".12" depth="2.2" material="color:#8f7b66"></a-box>
  <a-box position="7 0.05 10.0" width="6" height=".12" depth="2.2" material="color:#8f7b66"></a-box>
  <a-box position="-7 3.2 10.0" width="6" height=".12" depth="2.2" material="color:#8f7b66"></a-box>
  <a-box position="7 3.2 10.0" width="6" height=".12" depth="2.2" material="color:#8f7b66"></a-box>
 </a-entity>

 <!-- exterior landscaping -->
 <a-plane position="0 -.08 0" rotation="-90 0 0" width="40" height="40" material="color:#b7aa95"></a-plane>
 <a-cylinder position="-13 1.2 -7" radius=".9" height="2.4" material="color:#5c4030"></a-cylinder>
 <a-sphere position="-13 3.0 -7" radius="2.0" material="color:#637253"></a-sphere>
 <a-cylinder position="13 1.2 -7" radius=".9" height="2.4" material="color:#5c4030"></a-cylinder>
 <a-sphere position="13 3.0 -7" radius="2.0" material="color:#637253"></a-sphere>

 <!-- VR rig -->
 <a-entity id="rig" position="0 1.65 7.0" thumb-move
   laser-controls="hand: left">
   <a-entity camera position="0 0 0" look-controls="pointerLockEnabled:false"></a-entity>
   <a-entity laser-controls="hand:left" thumb-move></a-entity>
   <a-entity laser-controls="hand:right"></a-entity>
 </a-entity>
</a-scene>
</body>
</html>
