<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa 400 m² — Visita VR</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#d8cbb8}
#msg{position:fixed;z-index:10;left:12px;right:12px;top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.94);font:16px Arial;color:#3d2b1f}
</style>
</head>
<body>
<div id="msg">Casa 400 m² — ruota il telefono per guardarti intorno. Sul Meta Quest 3 comparirà “Enter VR”.</div>
<a-scene
  background="color:#d8cbb8"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  vr-mode-ui="enabled:true"
  webxr="optionalFeatures: local-floor, bounded-floor">

  <a-assets>
    <a-asset-item id="house" src="casa_400mq_3D_arredata.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type:ambient;intensity:1.8;color:#fff"></a-entity>
  <a-entity light="type:directional;intensity:2.5;color:#fff" position="-5 10 6"></a-entity>

  <a-entity id="rig" position="0 0 0"
            movement-controls="speed:0.12;fly:false">
    <a-camera position="0 1.6 6" look-controls="pointerLockEnabled:false"></a-camera>
    <a-entity laser-controls="hand:left"></a-entity>
    <a-entity laser-controls="hand:right"></a-entity>
  </a-entity>

  <a-entity id="houseModel"
            gltf-model="#house"
            position="0 0 0"
            scale="1 1 1">
  </a-entity>
</a-scene>
</body>
</html>
